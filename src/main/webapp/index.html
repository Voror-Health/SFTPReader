<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>SFTP Reader Management Interface</title>

        <link href="css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">

            <div class="page-header">
                <h1>SFTP Reader Management Interface</h1>
                <p id="message"></p>
            </div>

            <!-- The status API is protected by Casdoor: a token for a user with vhp_ui_admin or vhp_service is needed. -->
            <div class="panel panel-default">
                <div class="panel-heading">Casdoor token</div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-sm-4"><input id="authhost" class="form-control" placeholder="Casdoor host, e.g. https://auth.example.net"></div>
                        <div class="col-sm-4"><input id="clientid" class="form-control" placeholder="Client ID"></div>
                        <div class="col-sm-4"><input id="clientsecret" type="password" class="form-control" placeholder="Client secret"></div>
                    </div>
                    <div class="row" style="margin-top: 8px">
                        <div class="col-sm-4"><input id="username" class="form-control" placeholder="Username"></div>
                        <div class="col-sm-4"><input id="password" type="password" class="form-control" placeholder="Password"></div>
                        <div class="col-sm-4"><button id="gettoken" class="btn btn-success">Get token</button></div>
                    </div>
                    <div class="row" style="margin-top: 8px">
                        <div class="col-sm-10"><input id="token" class="form-control" placeholder="...or paste a bearer token"></div>
                        <div class="col-sm-2"><button id="refresh" class="btn btn-primary">Show status</button></div>
                    </div>
                </div>
            </div>

            <pre id="status"></pre>

        </div>
        <script src="js/jquery.min.js"></script>
        <script src="js/bootstrap.min.js"></script>
        <script src="index.js"></script>
</body>
</html>
